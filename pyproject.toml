[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge81"
version = "0.5.0"
description = "A lightweight Python, Cygwin and Ren'Py workbench for Windows 8.1."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HamWebDevs"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 8.1",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
bridge81 = "bridge81.cli:main"

[project.gui-scripts]
bridge81-gui = "bridge81.gui:main"

[project.entry-points."devpocket.tools"]
bridge81-game = "bridge81.integration:build_tool"
bridge81-runtime-log = "bridge81.integration:build_runtime_log_tool"

[project.urls]
Source = "https://github.com/HamWebDevs/Bridge81"
Issues = "https://github.com/HamWebDevs/Bridge81/issues"

[tool.setuptools.packages.find]
include = ["bridge81*"]
