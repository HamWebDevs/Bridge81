name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: bridge81 --version
      - run: bridge81 doctor
      - run: bridge81 plan python examples/hello.py
      - run: bridge81 run python examples/hello.py
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Linux native desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/gui_smoke.py
      - name: Windows native desktop smoke
        if: runner.os == 'Windows'
        run: python tests/gui_smoke.py
      - name: Parse Windows PowerShell setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          foreach ($file in Get-ChildItem scripts/*.ps1,tests/*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          }
      - name: Python-free runtime repair UI smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/Repair-RenPy.ps1 -SmokeTest
      - name: Check source launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: Start-Bridge81.cmd --version
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: bridge81-source-and-python-distributions
          path: dist/*
  runtime-repair:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime download, architecture matching, backups and rollback
        shell: powershell
        run: ./tests/runtime_repair_test.ps1
  cygwin:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install official Cygwin for integration testing
        shell: powershell
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'cygwin-setup.exe'
          $root = Join-Path $env:RUNNER_TEMP 'bridge81-cygwin'
          $cache = Join-Path $env:RUNNER_TEMP 'bridge81-cygwin-cache'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://cygwin.com/setup-x86_64.exe' -OutFile $setup
          $setupArgs = @('--quiet-mode', '--no-admin', '--root', ('"{0}"' -f $root), '--local-package-dir', ('"{0}"' -f $cache), '--site', 'https://mirrors.kernel.org/sourceware/cygwin/', '--packages', 'bash,coreutils')
          $process = Start-Process -FilePath $setup -ArgumentList $setupArgs -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw ('Cygwin setup failed: ' + $process.ExitCode) }
          "BRIDGE81_TEST_CYGWIN=$root\bin\bash.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python tests/cygwin_smoke.py
